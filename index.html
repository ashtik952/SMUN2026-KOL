<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>SMUN2026 3rd Edition</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style id="css">
/* Concept: a black council chamber lit in gold. Sankalp's own palette: black ground, gold seals, blue-to-pink gradient wordmark. Committees are seal cards with the executive board listed under each agenda. Deliberately one dark look. */
:root{
  color-scheme:dark;
  --bg:#000000;--surface:#0E0D12;--surface2:#17151D;--ink:#F4F0E8;--muted:#A9A192;
  --line:rgba(226,184,79,.22);--gold:#E2B84F;--ember:#FF5340;
  --grad:linear-gradient(90deg,#5B6CFF 0%,#B26BE6 50%,#FF5FA8 100%);
  --grad2:linear-gradient(90deg,#FF6FB1 0%,#FFC95C 100%);
  --display:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  --label:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
body.has-bar{padding-bottom:88px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{display:block;max-width:100%}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.g1{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.g2{background:var(--grad2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,0,0,.92);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;min-height:56px}
.brand{font-family:var(--display);font-size:1.6rem;letter-spacing:.04em;color:var(--gold);text-decoration:none;white-space:nowrap;line-height:1}
.top nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;margin-left:auto}
.top nav::-webkit-scrollbar{display:none}
.top nav a{font-family:var(--label);font-weight:600;font-size:.95rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:10px;white-space:nowrap}
.top nav a:hover{color:var(--ink)}

/* hero */
.hero{background:radial-gradient(ellipse 70% 60% at 18% 0%,rgba(226,184,79,.16),transparent 62%),var(--bg);border-bottom:1px solid var(--line)}
.hero-in{padding-block:clamp(36px,7vw,88px) clamp(40px,7vw,80px)}
.hero-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px clamp(20px,4vw,56px);align-items:center}
.logo{width:clamp(130px,22vw,260px);height:auto;aspect-ratio:1;border-radius:50%;box-shadow:0 0 60px rgba(226,184,79,.18)}
.kick{font-family:var(--label);font-weight:600;font-size:.95rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.mark{display:inline-block;font-family:var(--display);font-weight:400;font-size:clamp(3.6rem,15vw,10.5rem);line-height:.9;letter-spacing:.01em;margin:0}
.edition{font-family:var(--display);font-size:clamp(1.5rem,5vw,3rem);letter-spacing:.05em;color:var(--ember);margin:4px 0 0;line-height:1}
.tagline{display:inline-block;font-family:var(--display);font-size:clamp(1.6rem,5vw,3rem);letter-spacing:.05em;line-height:1.1;margin:22px 0 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 28px;margin:44px 0 36px}
.fact{border-top:1px solid var(--line);padding:14px 0;min-width:0}
.fl{display:block;font-family:var(--label);font-weight:600;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.fv{display:block;font-size:1.15rem;font-weight:500}
.btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn,.btn2{display:inline-block;font-family:var(--label);font-weight:700;font-size:1.1rem;letter-spacing:.12em;text-transform:uppercase;padding:14px 28px;border-radius:2px;text-decoration:none}
.btn{background:var(--gold);color:#000}
.btn2{border:1px solid var(--gold);color:var(--gold)}
@media (max-width:640px){.hero-grid{grid-template-columns:minmax(0,1fr)}}

/* sections */
.sec{padding-block:clamp(56px,9vw,104px)}
.sec+.sec{border-top:1px solid var(--line)}
.sh{margin-bottom:40px}
.eye{font-family:var(--label);font-weight:600;font-size:.9rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.h2{display:inline-block;font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,8vw,5rem);line-height:1;letter-spacing:.02em;margin:0}
.lab{display:block;font-family:var(--label);font-weight:600;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.val{display:block;overflow-wrap:anywhere}

/* address */
.sg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:32px clamp(32px,6vw,80px)}
.sg .sh{margin:0}
.sgb p,.sgb .para{font-size:clamp(1.02rem,1.6vw,1.15rem);line-height:1.85;margin:0 0 1.2em;color:#E4DECF;white-space:pre-wrap;display:block}
.sgb .hi{color:var(--ink);font-weight:500}
.sign{border-top:1px solid var(--line);padding-top:18px;margin-top:28px}
.sign .nm{display:block;font-family:var(--display);font-size:2rem;letter-spacing:.04em;line-height:1.1}
.sign .rl{display:block;font-family:var(--label);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-size:.9rem}
@media (max-width:820px){.sg{grid-template-columns:minmax(0,1fr)}}

/* committees */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:24px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:26px;min-width:0;display:flex;flex-direction:column;gap:22px}
.ch{display:flex;gap:20px;align-items:center}
.seal{flex:none;width:96px;height:96px;border-radius:50%;object-fit:cover;background:#000;box-shadow:0 0 28px rgba(226,184,79,.2)}
.ch>div{min-width:0}
.code{display:block;font-family:var(--label);font-weight:700;letter-spacing:.24em;font-size:.85rem;color:var(--ember)}
.cname{display:block;font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,4vw,2.3rem);line-height:1;letter-spacing:.03em;margin:2px 0 4px}
.motto{display:block;font-style:italic;color:var(--muted);font-size:.9rem}
.agenda{display:block;font-size:1rem;line-height:1.6;white-space:pre-wrap}
.freeze{display:inline-block;border:1px solid var(--ember);color:#FFB1A8;padding:6px 12px;border-radius:2px;font-weight:500;font-size:.9rem}
.board{list-style:none;margin:0;padding:0}
.brow{position:relative;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.95rem}
.brow .r{font-family:var(--label);font-weight:600;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.editing .brow{padding-right:36px}

/* team */
.tg{margin-bottom:48px}
.tg:last-child{margin-bottom:0}
.gname{display:block;font-family:var(--display);font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:.05em;color:var(--ember);margin:0 0 18px;line-height:1}
.core{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.cc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px}
.cc .nm{display:block;font-family:var(--display);font-size:1.9rem;letter-spacing:.03em;line-height:1.1;margin-top:4px}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:0 48px}
.lr{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lr .r{font-family:var(--label);font-weight:600;font-size:.9rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lr .nm{font-weight:500}
.editing .lr{padding-right:36px}

/* partners */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px}
.pc{position:relative;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:24px;min-width:0}
.plate{background:#000;border-radius:4px;display:grid;place-items:center;height:190px;overflow:hidden}
.plate img{max-height:170px;width:auto;object-fit:contain}
.pn{display:block;font-family:var(--display);font-size:1.8rem;letter-spacing:.04em;line-height:1.1}
.pt{margin:0;color:var(--muted);font-size:.95rem;white-space:pre-wrap;display:block}
.plink{align-self:flex-start;margin-top:auto;font-family:var(--label);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:2px}

/* gallery + documents */
.masonry{columns:3 240px;column-gap:16px}
.ph{position:relative;break-inside:avoid;margin:0 0 16px}
.ph img{width:100%;height:auto;border-radius:4px;cursor:zoom-in;background:var(--surface)}
.cap{display:block;font-size:.85rem;color:var(--muted);padding-top:6px}
.hint{color:var(--muted);border:1.5px dashed var(--line);border-radius:4px;padding:28px;margin:0}
.docs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.doc{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.ext{min-width:56px;text-align:center;font-family:var(--label);font-weight:700;font-size:.85rem;letter-spacing:.1em;border:1px solid var(--gold);color:var(--gold);padding:10px 8px;border-radius:2px}
.dt{display:block;font-weight:600}
.dn{display:block;color:var(--muted);font-size:.9rem}
.open{color:var(--gold);font-family:var(--label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border:1px solid var(--gold);padding:8px 16px;border-radius:2px;white-space:nowrap}
.editing .doc{padding-right:40px}

/* register */
.reg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px clamp(24px,5vw,56px);align-items:center;background:linear-gradient(135deg,#14120B,#0A0A0E);border:1px solid var(--line);border-radius:4px;padding:clamp(24px,5vw,48px)}
.reg .seal{width:clamp(88px,16vw,150px);height:clamp(88px,16vw,150px)}
.rt{display:block;font-family:var(--display);font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;letter-spacing:.03em}
.rs{display:block;font-family:var(--label);font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:6px 0 14px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{border:1px solid var(--line);background:var(--surface2);color:var(--gold);font-weight:500;font-size:.85rem;padding:4px 12px;border-radius:999px}
.rn{display:block;margin:0 0 22px;max-width:46ch;white-space:pre-wrap}
@media (max-width:640px){.reg{grid-template-columns:minmax(0,1fr)}}

/* contact */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.ct{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px}
.ct .nm{display:block;font-family:var(--display);font-size:1.9rem;letter-spacing:.03em;line-height:1.1;margin:4px 0 10px}
.tel{display:inline-block;font-weight:500;font-size:1.05rem;color:var(--gold);text-decoration:none;overflow-wrap:anywhere}

.foot{border-top:1px solid var(--line);padding-block:32px;color:var(--muted);font-size:.9rem}
.foot .wrap{display:flex;gap:16px 28px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.foot a,.link{color:var(--gold);background:none;border:0;font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.fr{display:flex;gap:20px;flex-wrap:wrap}

/* editing */
.editing [contenteditable]{outline:1.5px dashed var(--gold);outline-offset:3px;border-radius:2px;min-width:2ch}
.editing [contenteditable]:focus{outline-style:solid;background:rgba(226,184,79,.1)}
.editing .g1,.editing .g2{-webkit-text-fill-color:currentColor;background:none;color:var(--ink)}
[contenteditable]:empty::before{content:attr(data-ph);opacity:.45}
.x{position:absolute;top:8px;right:8px;z-index:2;width:28px;height:28px;line-height:1;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:50%;font-size:1rem;cursor:pointer}
.brow .x,.lr .x,.doc .x{top:50%;margin-top:-14px;right:0}
.add{display:inline-flex;align-items:center;gap:6px;margin:14px 10px 0 0;border:1.5px dashed var(--gold);color:var(--gold);background:transparent;font:600 .85rem var(--body);padding:10px 16px;border-radius:4px;cursor:pointer}
.url{width:100%;max-width:420px;margin-top:8px;font:.85rem var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface2);color:var(--ink)}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#F4F0E8;color:#111;display:flex;flex-wrap:wrap;align-items:center;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#bar .st{margin-right:auto;font-size:.85rem;font-weight:500}
#bar .acc{display:flex;align-items:center;gap:8px;font-size:.85rem}
#bar input[type=color]{width:34px;height:30px;padding:0;border:0;background:none}
.b1,.b2{font:600 .9rem var(--body);padding:10px 18px;border-radius:4px;cursor:pointer}
.b1{background:#111;color:#F4F0E8;border:1px solid #111}
.b2{background:transparent;color:inherit;border:1px solid currentColor}

/* lightbox + intro */
#lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.94);display:grid;place-items:center;padding:16px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#intro{position:fixed;inset:0;z-index:100;background:#000;color:var(--ink);display:flex;flex-direction:column;justify-content:center;
  padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));transition:transform .85s cubic-bezier(.76,0,.24,1);cursor:pointer;
  background-image:radial-gradient(ellipse 70% 50% at 20% 30%,rgba(226,184,79,.14),transparent 65%)}
#intro.out{transform:translateY(-100%)}
#intro .i1{font-family:var(--display);font-size:clamp(4rem,22vw,13rem);line-height:.9;min-height:.9em;letter-spacing:.01em;overflow-wrap:anywhere}
#intro .i1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
#intro .i2{font-family:var(--display);font-size:clamp(1.6rem,7vw,3.4rem);letter-spacing:.14em;color:var(--ember);min-height:1.1em;margin-top:14px;line-height:1.1}
#intro .skip{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));font-family:var(--label);font-weight:600;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,240,232,.45)}
.cur{display:inline-block;width:.06em;height:.8em;margin-left:.06em;vertical-align:-.04em;background:var(--gold);animation:blink 1s steps(1) infinite}
.i2 .cur{width:.07em;background:var(--ember);height:.9em}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>

function fileBtn(label,key,accept,multi){
  if(!editing||!assets)return '';
  return '<label class="add">'+esc(label)+'<input type="file" hidden data-up="'+key+'" accept="'+accept+'"'+(multi?' multiple':'')+'></label>';
}
function urlIn(p,ph){return editing?'<input class="url" type="url" data-p="'+p+'" value="'+esc(getP(p))+'" placeholder="'+esc(ph)+'" aria-label="'+esc(ph)+'">':''}
function sec(id,inner){return '<section id="'+id+'" class="sec"><div class="wrap">'+inner+'</div></section>'}
function head(eye,path){return '<header class="sh"><p class="eye">'+esc(eye)+'</p>'+ed(path,'h2','h2 g2','Section title')+'</header>'}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function regUrl(){return S.register.url||'#register'}

function render(){
  var h=S.hero,out='',nav=[];
  var cm=S.committees.items,gl=S.gallery.items,dc=S.documents.items,pt=S.partners.items;
  var showG=gl.length||editing,showD=dc.length||editing;
  nav.push(['address','Address'],['committees','Committees'],['team','Team'],['partners','Partners']);
  if(showG)nav.push(['gallery','Gallery']);
  if(showD)nav.push(['documents','Documents']);
  nav.push(['register','Register'],['contact','Contact']);

  out+='<div class="top"><div class="wrap bar"><a class="brand" href="#top">'+esc(h.title)+'</a><nav aria-label="Sections">'+nav.map(function(n){return '<a href="#'+n[0]+'">'+n[1]+'</a>'}).join('')+'</nav></div></div>';

  out+='<section id="top" class="hero"><div class="wrap hero-in"><div class="hero-grid"><div>'
    +(h.logo?'<img class="logo" src="'+esc(A(h.logo))+'" alt="Sankalp Model United Nations 3rd Edition seal">':'')
    +fileBtn(h.logo?'Change logo':'Add logo','hero.logo','image/*',false)+'</div><div>'
    +ed('hero.kicker','p','kick','Kicker')
    +ed('hero.title','h1','mark g1','Conference name')
    +'<br>'+ed('hero.edition','p','edition','Edition')
    +ed('hero.tagline','p','tagline g1','Tagline')
    +'</div></div>'
    +'<div class="facts">'+h.facts.map(function(f,i){return '<div class="fact">'+ed('hero.facts.'+i+'.l','span','fl','Label')+ed('hero.facts.'+i+'.v','span','fv','Detail')+'</div>'}).join('')+'</div>'
    +'<div class="btns">'+(editing?'<span class="btn">'+ed('hero.cta','span','','Button text')+'</span>':'<a class="btn" href="'+esc(regUrl())+'"'+(S.register.url?' target="_blank" rel="noopener"':'')+'>'+esc(h.cta)+'</a>')+'<a class="btn2" href="#committees">Explore committees</a></div>'
    +'</div></section>';

  var paras=S.sg.body.split(/\n\s*\n/).filter(function(p){return p.trim()});
  out+=sec('address','<div class="sg"><header class="sh"><p class="eye">From the chair of the Secretariat</p>'+ed('sg.title','h2','h2 g2','Title')+'</header><div class="sgb">'
    +(editing?ed('sg.body','p','para','Write the address. Leave a blank line between paragraphs.',true)
      :paras.map(function(p,i){return '<p'+(i<2?' class="hi"':'')+'>'+esc(p)+'</p>'}).join(''))
    +'<div class="sign">'+ed('sg.name','span','nm','Name')+ed('sg.role','span','rl','Role')+'</div></div></div>');

  out+=sec('committees',head(plural(cm.length,'committee'),'committees.title')
    +'<div class="grid">'+cm.map(function(c,i){var b='committees.items.'+i+'.';
      return '<article class="card"><div class="ch">'+(c.seal?'<img class="seal" src="'+esc(A(c.seal))+'" alt="">':'')
        +'<div>'+ed(b+'code','span','code','CODE')+ed(b+'name','h3','cname','Committee name')+ed(b+'motto','span','motto','Motto')+fileBtn(c.seal?'Change seal':'Add seal','committees:'+i,'image/*',false)+'</div></div>'
        +'<div><span class="lab">Agenda</span>'+ed(b+'agenda','span','agenda','Agenda',true)+'</div>'
        +(c.freeze||editing?'<div><span class="lab">Freeze date</span>'+ed(b+'freeze','span','freeze','Freeze date')+'</div>':'')
        +'<div><span class="lab">Executive board</span><ul class="board">'
        +c.board.map(function(m,j){var d=b+'board.'+j+'.';return '<li class="brow">'+ed(d+'role','span','r','Role')+ed(d+'name','span','','Name')+del('committees.items.'+i+'.board',j)+'</li>'}).join('')
        +'</ul>'+addBtn('Add board member','committees.items.'+i+'.board','board')+'</div>'
        +del('committees.items',i)+'</article>'}).join('')+'</div>'
    +addBtn('Add committee','committees.items','committees'));

  out+=sec('team',head('The people behind it','team.title')
    +S.team.groups.map(function(g,gi){var b='team.groups.'+gi+'.';
      return '<div class="tg">'+ed(b+'name','h3','gname','Group name')
        +(gi===0
          ?'<div class="core">'+g.members.map(function(m,j){var d=b+'members.'+j+'.';return '<div class="cc">'+ed(d+'role','span','lab','Role')+ed(d+'name','span','nm','Name')+del('team.groups.'+gi+'.members',j)+'</div>'}).join('')+'</div>'
          :'<div class="list">'+g.members.map(function(m,j){var d=b+'members.'+j+'.';return '<div class="lr">'+ed(d+'role','span','r','Role')+ed(d+'name','span','nm','Name')+del('team.groups.'+gi+'.members',j)+'</div>'}).join('')+'</div>')
        +addBtn('Add member','team.groups.'+gi+'.members','members')+(editing&&S.team.groups.length>1?'<button class="add" data-act="del" data-list="team.groups" data-i="'+gi+'">Remove group</button>':'')+'</div>'}).join('')
    +addBtn('Add group','team.groups','groups'));

  out+=sec('partners',head('Backed by','partners.title')
    +'<div class="pgrid">'+pt.map(function(p,i){var b='partners.items.'+i+'.';
      return '<article class="pc"><div class="plate">'+(p.logo?'<img src="'+esc(A(p.logo))+'" alt="'+esc(p.name||p.role)+' logo">':'')+'</div>'
        +ed(b+'role','span','lab','Role')+(p.name||editing?ed(b+'name','span','pn','Partner name'):'')
        +(p.text||editing?ed(b+'text','span','pt','About the partner',true):'')
        +(editing?urlIn(b+'url','Link to partner website'):(p.url?'<a class="plink" href="'+esc(p.url)+'" target="_blank" rel="noopener">About them</a>':''))
        +fileBtn(p.logo?'Change logo':'Add logo','partners:'+i,'image/*',false)+del('partners.items',i)+'</article>'}).join('')+'</div>'
    +addBtn('Add partner','partners.items','partners'));

  if(showG){
    out+=sec('gallery',head(gl.length?plural(gl.length,'photo'):'Photos','gallery.title')
      +(gl.length?'<div class="masonry">'+gl.map(function(g,i){return '<figure class="ph"><img src="'+esc(g.url)+'" alt="'+esc(g.caption||'Conference photo')+'" loading="lazy" data-lb="1">'+ed('gallery.items.'+i+'.caption','figcaption','cap','Caption')+del('gallery.items',i)+'</figure>'}).join('')+'</div>'
        :'<p class="hint">Photos from the conference will appear here. Use “Add photos” to upload them.</p>')
      +fileBtn('Add photos','gallery','image/png,image/jpeg,image/webp,image/gif',true));
  }
  if(showD){
    out+=sec('documents',head(dc.length?plural(dc.length,'document'):'Files','documents.title')
      +(dc.length?'<ul class="docs">'+dc.map(function(d,i){var b='documents.items.'+i+'.';
        return '<li class="doc"><span class="ext">'+esc(d.ext||'FILE')+'</span><div>'+ed(b+'title','span','dt','Title')+ed(b+'note','span','dn','Description')+urlIn(b+'url','Link to the file')+'</div>'
          +(d.url&&!editing?'<a class="open" href="'+esc(d.url)+'" target="_blank" rel="noopener">Open</a>':'<span></span>')+del('documents.items',i)+'</li>'}).join('')+'</ul>'
        :'<p class="hint">Background guides, rules of procedure and handbooks go here. Upload a PDF or add a link.</p>')
      +fileBtn('Upload PDF or image','documents','application/pdf,image/png,image/jpeg,image/webp,text/plain,text/csv,.md,.json',true)
      +addBtn('Add a link','documents.items','link'));
  }

  var r=S.register;
  out+=sec('register',head('Delegate applications','register.title')
    +'<div class="reg"><div>'+(r.seal?'<img class="seal" src="'+esc(A(r.seal))+'" alt="">':'')+'</div><div>'
    +'<span class="rt g1">'+esc(S.hero.title)+'</span><span class="rs">'+esc(S.hero.kicker)+'</span>'
    +'<div class="pills">'+r.pills.map(function(p,i){return ed('register.pills.'+i,'span','pill','Detail')}).join('')+'</div>'
    +ed('register.note','span','rn','Registration details',true)
    +(editing?'<span class="btn">'+ed('register.cta','span','','Button text')+'</span>'+urlIn('register.url','Registration link (Gavelling page)')
      :'<a class="btn" href="'+esc(regUrl())+'"'+(r.url?' target="_blank" rel="noopener"':'')+'>'+esc(r.cta)+'</a>')
    +'</div></div>');

  out+=sec('contact',head('Reach the Secretariat','contact.title')
    +'<div class="cgrid">'+S.contact.people.map(function(p,i){var b='contact.people.'+i+'.';
      var digits=String(p.phone||'').replace(/[^\d+]/g,'');
      return '<div class="ct">'+ed(b+'role','span','lab','Role')+ed(b+'name','span','nm','Name')
        +(editing?ed(b+'phone','span','tel','Phone'):'<a class="tel" href="tel:'+esc(digits)+'">'+esc(p.phone)+'</a>')+del('contact.people',i)+'</div>'}).join('')+'</div>'
    +addBtn('Add contact','contact.people','people'));

  out+='<footer class="foot"><div class="wrap"><span>'+ed('footer.text','span','','Footer text')+'</span><div class="fr">'
    +(editing?urlIn('footer.instagram','Instagram link'):(S.footer.instagram?'<a href="'+esc(S.footer.instagram)+'" target="_blank" rel="noopener">Instagram</a>':''))
    +'<button class="link" data-act="replay">Replay intro</button></div></div></footer>';

  app.className=editing?'editing':'';
  app.innerHTML=out;
}

/* ---------- editing bar ---------- */
function setStatus(t){var s=document.getElementById('st');if(s)s.textContent=t}
function markDirty(){dirty=true;setStatus('Unsaved changes')}
function renderBar(){
  var b=document.getElementById('bar');
  if(!canEdit){if(b)b.remove();return}
  if(!b){b=document.createElement('div');b.id='bar';document.body.appendChild(b);document.body.classList.add('has-bar')}
  b.innerHTML=editing
    ?'<span class="st" id="st">'+(dirty?'Unsaved changes':'Editing. Tap any text to change it.')+'</span><label class="acc">Gold <input type="color" id="accent" value="'+esc(S.accent)+'"></label><button class="b2" data-act="discard">Discard</button><button class="b1" data-act="save">Save and publish</button>'
    :'<span class="st" id="st">You can edit this site.</span><button class="b1" data-act="edit">Edit site</button>';
}
function applyAccent(){document.documentElement.style.setProperty('--gold',S.accent)}

/* ---------- uploads ---------- */
var EXT={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',txt:'text/plain',md:'text/markdown',csv:'text/csv',json:'application/json',svg:'image/svg+xml'};
function extOf(f){var m=/\.([A-Za-z0-9]+)$/.exec(f.name||'');return m?m[1].toLowerCase():''}
function sizeText(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function upMsg(e,f){
  var c=e&&e.code;
  if(c==='unsupported_type')return f.name+' can’t be uploaded. Use JPG, PNG, WebP or PDF. For Word files, save as PDF first.';
  if(c==='too_large')return f.name+' is too large (20 MB limit).';
  if(c==='quota_or_state')return 'Upload storage is full.';
  if(c==='rate_limited')return 'Too many uploads at once. Wait a moment and try again.';
  return 'Upload failed for '+f.name+'.';
}
function place(key,f,r){
  var url='/_blob/'+r.id,e=extOf(f);
  if(key==='gallery')S.gallery.items.push({url:url,caption:''});
  else if(key==='documents')S.documents.items.push({title:f.name.replace(/\.[^.]+$/,''),note:sizeText(f.size),url:url,ext:(e||'file').toUpperCase()});
  else if(key.indexOf('committees:')===0)S.committees.items[+key.slice(11)].seal=url;
  else if(key.indexOf('partners:')===0)S.partners.items[+key.slice(9)].logo=url;
  else setP(key,url);
}
function doUpload(files,key){
  if(!assets){setStatus('Uploads are not available in this view.');return}
  var list=[].slice.call(files),chain=Promise.resolve(),problems=[];
  setStatus('Uploading '+plural(list.length,'file')+'…');
  list.forEach(function(f){
    chain=chain.then(function(){
      var t=EXT[extOf(f)]||f.type;
      return assets.upload(f,t?{type:t}:undefined).then(function(r){place(key,f,r)}).catch(function(e){problems.push(upMsg(e,f))});
    });
  });
  chain.then(function(){render();markDirty();if(problems.length)setStatus(problems[0])});
}

/* ---------- save ---------- */
function buildDoc(){
  var rs=[].slice.call(document.head.querySelectorAll('style:not(#css)')).filter(function(s){return /safe-area-inset/.test(s.textContent)&&s.textContent.length<3000})[0];
  var reset=rs?rs.textContent:RESET;
  var json=JSON.stringify(S).replace(/</g,'\\u003c');
  var page='<title>'+document.title+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+FONT+'\n<style id="css">'+document.getElementById('css').textContent+'<\/style>\n<div id="app"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="code">'+document.getElementById('code').textContent+'<\/script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+page+'</body></html>';
}
function save(){
  setStatus('Publishing…');
  if(!(window.claude&&claude.use)){setStatus('Publishing is not available here.');return}
  claude.use('artifact').then(function(a){
    if(!a)throw {code:'unavailable'};
    return a.publish(buildDoc());
  }).then(function(){dirty=false;setStatus('Published')}).catch(function(e){
    var c=e&&e.code;
    setStatus(c==='conflict'?'Someone saved first. Reloading their version.':c==='not_writer'||c==='not_granted'?'You do not have permission to publish.':'Could not publish. Try again.');
  });
}

/* ---------- intro ---------- */
function intro(force){
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,seen=false;
  try{seen=sessionStorage.getItem('smun_intro')==='1'}catch(e){}
  if(!force&&(reduce||seen))return;
  try{sessionStorage.setItem('smun_intro','1')}catch(e){}
  var o=document.createElement('div');o.id='intro';
  o.innerHTML='<div class="i1"><span></span><i class="cur"></i></div><div class="i2"><span></span></div><div class="skip">Tap to skip</div>';
  document.body.appendChild(o);
  var a=o.querySelector('.i1 span'),b=o.querySelector('.i2 span'),cur=o.querySelector('.cur'),timers=[],done=false;
  function at(ms,fn){timers.push(setTimeout(fn,ms))}
  function type(el,txt,start,step,cb){for(var i=1;i<=txt.length;i++)(function(i){at(start+i*step,function(){el.textContent=txt.slice(0,i);if(i===txt.length&&cb)cb()})})(i)}
  function finish(){
    if(done)return;done=true;timers.forEach(clearTimeout);
    o.classList.add('out');setTimeout(function(){o.remove()},900);
  }
  var t1=String(S.hero.title||'').replace(/\s+/g,''),t2=String(S.hero.edition||'');
  type(a,t1,350,95,function(){
    cur.remove();
    var c2=document.createElement('i');c2.className='cur';b.parentNode.appendChild(c2);
    type(b,t2,300,70,function(){at(900,finish)});
  });
  o.addEventListener('click',finish);
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'||e.key==='Enter'||e.key===' '){finish();document.removeEventListener('keydown',k)}});
}

/* ---------- events ---------- */
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='accent'){S.accent=t.value;applyAccent();markDirty();return}
  if(!t.getAttribute||!t.getAttribute('data-p'))return;
  var v=t.tagName==='INPUT'?t.value:t.innerText.replace(/\n$/,'');
  setP(t.getAttribute('data-p'),v);markDirty();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('data-sl')&&e.target.isContentEditable){e.preventDefault()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches&&t.matches('input[data-up]')){var f=t.files;if(f&&f.length)doUpload(f,t.getAttribute('data-up'));t.value=''}
});
document.addEventListener('click',function(e){
  var lb=e.target.closest&&e.target.closest('img[data-lb]');
  if(lb&&!editing){
    var l=document.createElement('div');l.id='lb';l.innerHTML='<img alt="">';l.firstChild.src=lb.src;
    l.addEventListener('click',function(){l.remove()});document.body.appendChild(l);return;
  }
  var el=e.target.closest&&e.target.closest('[data-act]');
  if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='edit'){editing=true;render();renderBar()}
  else if(act==='discard'){
    try{S=merge(clone(DEFAULTS),JSON.parse(document.getElementById('state').textContent||'{}'))}catch(x){S=clone(DEFAULTS)}
    dirty=false;editing=false;applyAccent();render();renderBar();
  }
  else if(act==='save')save();
  else if(act==='add'){
    getP(el.getAttribute('data-list')).push(TPL[el.getAttribute('data-tpl')]());render();markDirty();
  }
  else if(act==='del'){
    getP(el.getAttribute('data-list')).splice(+el.getAttribute('data-i'),1);render();markDirty();
  }
  else if(act==='replay')intro(true);
});

/* ---------- init ---------- */
applyAccent();render();intro(false);
if(window.claude&&claude.use){
  claude.use('user').then(function(u){return u?u.canEdit():false}).then(function(ok){
    if(!ok)return;
    canEdit=true;renderBar();
    return claude.use('assets').then(function(a){assets=a;if(editing)render()});
  }).catch(function(){});
}
})();
</script></body></html>
